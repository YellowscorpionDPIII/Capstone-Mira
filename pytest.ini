[pytest]
# Pytest configuration for Mira platform
testpaths = mira/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Coverage configuration - agents, core, and LLM integration layer
addopts =
    --cov=mira/agents
    --cov=mira/core
    --cov=mira/llm
    --cov-report=term-missing
    --cov-report=html
    --cov-fail-under=60

# Markers
markers =
    benchmark: marks tests as benchmarks (deselect with '-m "not benchmark"')
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests

# asyncio mode
asyncio_mode = auto

# Warnings
filterwarnings =
    ignore::DeprecationWarning
